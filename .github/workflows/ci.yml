name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate project structure
      run: |
        test -f configs/decision_config.json
        test -f models/calibrated_xgb.pkl

    - name: Test API loads
      run: |
        python -c "from src.api.app import app; print('API loaded successfully')"

    - name: Test pipeline import
      run: |
        python -c "from src.pipeline.run_pipeline import run_pipeline; print('Pipeline import successful')"

    - name: Build Docker image
      run: |
        docker build -t churn-api:test .

    - name: Run tests
      run: |
        pip install pytest
        pytest tests/